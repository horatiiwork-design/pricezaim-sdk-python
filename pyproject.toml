[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pricezaim-sdk"
version = "0.1.0"
description = "Python client for the pricezaim public API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "horatiiwork-design", email = "horatiiwork-design@users.noreply.github.com"},
]
keywords = ["pricezaim", "api", "sdk", "auctions", "loans"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.9",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/horatiiwork-design/pricezaim-sdk-python"
Documentation = "https://github.com/horatiiwork-design/pricezaim-sdk-python/blob/main/docs/api.md"
Issues = "https://github.com/horatiiwork-design/pricezaim-sdk-python/issues"
Source = "https://github.com/horatiiwork-design/pricezaim-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pricezaim_sdk = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["PYI034", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
