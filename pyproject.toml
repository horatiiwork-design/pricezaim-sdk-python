[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricezaim-sdk"
version = "0.1.0"
description = "Python SDK for the pricezaim public API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "horatiiwork-design", email = "horatiiwork-design@users.noreply.github.com"}]
keywords = ["pricezaim", "api", "sdk", "auctions"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/horatiiwork-design/pricezaim-sdk-python"
Source = "https://github.com/horatiiwork-design/pricezaim-sdk-python"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pricezaim_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
